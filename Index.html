.hero i{position:absolute;border-radius:50%;background:rgba(255,255,255,.14);animation:float 7s ease-in-out infinite}

.hero>:not(i){position:relative}.hero h1{font-size:clamp(26px,5vw,40px);line-height:1.1;margin-bottom:6px}.hero p{margin:0 0 16px;max-width:460px;opacity:.92}

.art em{font-style:normal;font-weight:800;font-size:72px;color:rgba(28,33,64,.5);animation:float 5s ease-in-out infinite}

.mi{display:block;padding:10px 14px 13px}.mi b{display:block;font-size:14px;line-height:1.3}.mi small{color:var(--muted);font-size:12.5px}
.sc{float:right;font-weight:700;font-size:12.5px;color:var(--star)}
.sk{aspect-ratio:2/3.3;border-radius:24px;background:var(--line);animation:pulse 1.1s ease-in-out infinite alternate}
